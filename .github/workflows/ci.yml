name: CI

# Runs only when the code changes, so a change to the docs does not start a build.
on:
  pull_request:
    paths: ['RPM.iOS/**', 'RPM.tvOS/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['RPM.iOS/**', 'RPM.tvOS/**', '.github/workflows/ci.yml']

permissions:
  contents: read

jobs:
  modules:
    name: Module tests (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: [RPMArt, RPMAudio, RPMCast, RPMDesign, RPMKit, RPMLibrary, RPMRadio, RPMSession, RPMSharing, RPMStages]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: swift test
        working-directory: RPM.iOS/Modules/${{ matrix.module }}
        run: swift test
