name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.github/ISSUE_TEMPLATE/**']

permissions:
  contents: read

jobs:
  modules:
    name: Module tests (${{ matrix.module }})
    strategy:
      fail-fast: false
      matrix:
        module: [RPMArt, RPMAudio, RPMCast, RPMDesign, RPMKit, RPMLibrary, RPMRadio, RPMSession, RPMSharing, RPMStages]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: RPM.iOS/Modules/${{ matrix.module }}
        run: swift test
